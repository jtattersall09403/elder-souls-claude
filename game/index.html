<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- RI-JRN04 H3: viewport-fit=cover, so env(safe-area-inset-*) is non-zero on a notched phone.
     H5: user-scalable=no + maximum-scale=1 kill pinch-zoom and double-tap-zoom, which on a
     clamped landscape phone are two accidental gestures away from an unplayable camera. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Elder Souls</title>
<!--
  Wave-1 piece W1-00 — harness, determinism and persistence.
  Contract: corpus/80-methods/HARNESS.md. Automation seam: window.__HARNESS.

  This is a static site. No build step is required to run it, there is no network access at
  runtime, and Three.js is vendored at game/vendor/three/ so a strict CSP that blocks
  external hosts changes nothing (HARNESS.md R1).
-->
<style>
  /* RI-JRN04 H3: the four insets, read back by game/src/input/viewport.js as CSS custom
     properties so that one number describes the notch for the layout, the HUD and the touch
     controls at once. On a desktop or an un-notched phone they resolve to 0. */
  :root {
    --sai-top: env(safe-area-inset-top, 0px);
    --sai-right: env(safe-area-inset-right, 0px);
    --sai-bottom: env(safe-area-inset-bottom, 0px);
    --sai-left: env(safe-area-inset-left, 0px);
  }
  html, body { margin: 0; height: 100%; background: #05070a; overflow: hidden; }
  /* KB5: the page must not be scrollable at all; the canvas fills the viewport.
     H5: `overscroll-behavior: none` is what stops a downward drag near the top edge from
     reloading the page. A pull-to-refresh mid-boss is a total loss of the session, and it is
     this one property. `user-select` and the callout go with it. */
  body {
    overscroll-behavior: none; touch-action: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* H4: `dvh`, never `vh`. The URL bar collapsing mid-play is a viewport resize; with `vh` the
     canvas is 88 px taller than the visible area forever and the stamina bar sits under the
     browser chrome. `vh` is kept only as the fallback for a UA with no `dvh`. */
  canvas#view { display: block; width: 100vw; width: 100dvw; height: 100vh; height: 100dvh; cursor: none; }
  /* PL10: the cursor is hidden during gameplay and there is no software cursor drawn on
     the canvas. It is restored by the UI layer when a cursor-driven surface opens. */
  body.surface canvas#view { cursor: default; }
</style>
</head>
<body>
<canvas id="view" width="1920" height="1080"></canvas>

<!--
  The boot notice. RI-JRN01 O2: a player must never be shown a blank screen with no account of
  itself.

  This exists because the owner opened the published game on a phone and got a black rectangle,
  and neither of us could tell from it whether the world was still loading, whether WebGL had been
  refused, or whether a file had 404'd. The page was a canvas and a module script: any failure
  anywhere rendered as #05070a and silence, and the canvas is near-black before the first frame
  anyway, so "loading" and "broken" looked identical.

  Three properties matter and all three are why this is inline, plain, un-bundled script in the
  document rather than anything imported:
    * it runs BEFORE the module does, so a module that fails to parse still leaves a message;
    * it needs no network, so it survives every asset 404'ing;
    * it does not use ES module syntax, so an engine that cannot parse modules still shows it.
-->
<div id="boot-notice" role="status" aria-live="polite">
  <div class="bn-inner">
    <div class="bn-title">Elder Souls</div>
    <div class="bn-line" id="bn-line">Loading the province…</div>
    <div class="bn-sub" id="bn-sub">About 17 MB. The first load is the slow one.</div>
    <!-- The notice's whole purpose is to get a line of text off somebody's phone and into a
         message. `body` sets `user-select:none` and `-webkit-touch-callout:none` — which the
         game needs and this panel must not inherit — so on a phone the diagnostic could be read
         and not copied. A button that does it in one tap is the fix; the manual fallback is the
         selectable <code> block, re-enabled below. -->
    <div class="bn-actions" id="bn-actions" hidden>
      <button type="button" id="bn-copy">Copy this for the report</button>
    </div>
  </div>
</div>
<style>
  #boot-notice{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#05070a;color:#c8bda4;font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    z-index:9999;padding:24px;text-align:center}
  #boot-notice.gone{display:none}
  .bn-inner{max-width:34rem}
  .bn-title{font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:#7d7259;margin-bottom:18px}
  .bn-line{font-size:18px;color:#d8cdb2}
  .bn-sub{margin-top:12px;font-size:14px;color:#7d7259}
  .bn-bad .bn-line{color:#d98a6a}
  #boot-notice code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;
    color:#9a8f79;word-break:break-all;
    /* Selectable, against the body's blanket `user-select:none`. A diagnostic nobody can copy
       off the glass is not a diagnostic. */
    user-select:text;-webkit-user-select:text;-webkit-touch-callout:default}
  .bn-actions{margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .bn-actions button{font:inherit;font-size:15px;padding:11px 18px;border-radius:8px;
    border:1px solid #4a4133;background:#12161c;color:#d8cdb2;cursor:pointer;
    /* 44 px is the smallest thing a thumb hits reliably; these are the only two controls on a
       screen whose reason for existing is that nothing else is working. */
    min-height:44px;min-width:44px}
  .bn-actions button:active{background:#1c222b}
</style>
<script>
(function () {
  var el = document.getElementById('boot-notice');
  var line = document.getElementById('bn-line');
  var sub = document.getElementById('bn-sub');
  var actions = document.getElementById('bn-actions');
  var copyBtn = document.getElementById('bn-copy');
  if (!el) return;
  var done = false;

  // EVERY failure gets the device line, not just two of them. The first black screen was a 404
  // and the second was a thrown error, and neither of those paths printed a single fact about
  // the browser it happened in — which are the two failures where knowing the browser is the
  // whole diagnosis. `say(..., bad=true)` now appends it unconditionally.
  function say(msg, detail, bad) {
    if (done) return;
    line.textContent = msg;
    var body = detail || '';
    if (bad) {
      var d = deviceLine();
      body += '<br><br><b>Please send this line:</b><br><code id="bn-code">' + d + '</code>';
      window.__BOOT_DIAGNOSTIC = msg + ' :: ' + String(detail || '').replace(/<[^>]*>/g, ' ') + ' :: ' + d;
      if (actions) actions.hidden = false;
    }
    sub.innerHTML = body;
    el.className = bad ? 'bn-bad' : '';
  }
  function hide() { done = true; el.className = 'gone'; }

  if (copyBtn) copyBtn.addEventListener('click', function () {
    var text = window.__BOOT_DIAGNOSTIC || deviceLine();
    var ok = function () { copyBtn.textContent = 'Copied — paste it into the report'; };
    // `navigator.clipboard` needs a secure context and a user gesture; both hold here, but a
    // phone browser may still refuse, so there is a selection fallback that never can.
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(ok, selectFallback);
      } else selectFallback();
    } catch (e) { selectFallback(); }
    function selectFallback() {
      var code = document.getElementById('bn-code');
      if (!code) return;
      try {
        var r = document.createRange(); r.selectNodeContents(code);
        var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
        copyBtn.textContent = 'Selected — hold and choose Copy';
      } catch (e2) { copyBtn.textContent = 'Copy failed — please screenshot this'; }
    }
  });

  // WebGL first, because a phone that refuses it will never draw a frame no matter how long you
  // wait, and "keep waiting" is the wrong thing to tell someone in that case.
  try {
    var probe = document.createElement('canvas');
    if (!(probe.getContext('webgl2') || probe.getContext('webgl'))) {
      say('This browser will not give the game a 3D canvas.',
          'WebGL is unavailable or disabled. On iOS try Safari; on Android try Chrome. ' +
          'If you are in a private window or have hardware acceleration off, that is usually why.', true);
      return;
    }
  } catch (e) { /* the probe itself failing is not worth taking the page down for */ }

  // Anything thrown before the world comes up is the reason the screen is black. Say it.
  window.addEventListener('error', function (ev) {
    var what = ev && (ev.message || (ev.error && ev.error.message)) || 'an unknown error';
    var src = ev && ev.filename ? '<code>' + String(ev.filename).split('/').slice(-2).join('/') + '</code>' : '';
    say('The game stopped while loading.', what + '<br>' + src, true);
  }, true);
  window.addEventListener('unhandledrejection', function (ev) {
    var r = ev && ev.reason;
    say('The game stopped while loading.',
        (r && (r.message || String(r))) || 'a promise rejected with no message', true);
  });

  // A file that 404s is the single most likely cause of a silent black screen on a static host,
  // and it does not throw — the fetch resolves and the caller gets nothing useful.
  //
  // P10. THIS PANEL CALLED A 503 A MISSING FILE, TWICE, ON THE OWNER'S OWN LINK. Two live runs
  // died on `world/hazards.json` answering 503 from Pages' CDN and this screen said "A file the
  // game needs is missing." It was not missing. That sentence is the reason a whole session was
  // spent hunting an unpublished file that was published all along. So the two classes are now
  // separated here as well as in the loader:
  //
  //   * 5xx / 408 / 429 — the host is wobbling. The loader retries (see `LOAD_RETRY` in
  //     engine.js). This is NOT a failure yet, so it must not be dressed as one: it is reported
  //     as weather, in the progress line, with the status and the file, and the boot carries on.
  //     If the retries are eventually exhausted the loader's own rejection lands below with the
  //     status, the URL and the attempt count in it — nothing is swallowed.
  //   * anything else, 404 above all — the file is genuinely not there. Loud, immediately, with
  //     the device line. That is a different bug with a different fix and it must stay loud.
  var transientCount = 0, transientLast = '';
  function transientNote() {
    if (!transientCount) return '';
    return '<br><br>The server refused ' + transientCount + ' request' + (transientCount === 1 ? '' : 's') +
           ' (' + transientLast + '). Nothing is missing — the game is asking again.';
  }
  if (window.fetch) {
    var real = window.fetch;
    window.fetch = function () {
      return real.apply(this, arguments).then(function (res) {
        if (!res.ok && !done) {
          var where = String(res.url || '').split('/').slice(-3).join('/');
          if (res.status >= 500 || res.status === 408 || res.status === 429) {
            transientCount++;
            transientLast = res.status + ' on ' + where;
            // Observable after the fact, the way `__BOOT_DIAGNOSTIC` is: a transient that the
            // loader recovered from leaves no trace on the screen once the game is up, and
            // `tools/playability/loader-retry.mjs` has to be able to prove it happened.
            window.__BOOT_TRANSIENT = { count: transientCount, last: transientLast, status: res.status };
            // Not `bad`: the boot has not failed and saying it has is the defect being fixed.
            if (el.className !== 'bn-bad') say('Loading the province…', 'About 17 MB.' + transientNote(), false);
          } else {
            say('A file the game needs is missing.',
                res.status + ' on <code>' + where + '</code>', true);
          }
        }
        return res;
      });
    };
  }

  // Progress, so a slow connection reads as slow rather than as broken.
  var t0 = Date.now();
  var tick = setInterval(function () {
    if (done) { clearInterval(tick); return; }
    var s = Math.round((Date.now() - t0) / 1000);
    if (el.className === 'bn-bad') return;
    if (s > 90) say('Still loading, and this is longer than it should take.',
                    'If it never finishes, the console will say why. This is worth reporting.' + transientNote(), false);
    else if (s > 8) say('Loading the province…', 'About 17 MB. ' + s + 's so far.' + transientNote());
  }, 1000);

  // Hiding on "the harness object exists" was WRONG and it cost the owner a second black screen.
  // `main.js` installs the harness IMMEDIATELY, before boot resolves — it says so in a comment —
  // so the notice vanished a few hundred milliseconds in and left exactly the silent black
  // rectangle it exists to prevent. It flashed, and then it was gone, and the screen was black.
  //
  // Two conditions now, and both are necessary:
  //   * `ready()` resolves, which awaits the boot promise rather than the object's existence;
  //   * the canvas has actually drawn something — pixels a person could see.
  // A world that boots and draws nothing is a real state of this game and it must not read as
  // success. If that happens the notice says so, which is the diagnosis rather than the silence.
  // THE READ HAS TO HAPPEN INSIDE A FRAME, AND IT HAS TO BE RARE.
  //
  // Two things were wrong here and the second one was invisible until it was measured.
  //
  // 1. WHEN. `preserveDrawingBuffer` is off for players since a52113c — correctly, a second
  //    full-size copy of the framebuffer is a known way to lose a phone's GL context. With it
  //    off, the drawing buffer's contents are undefined once the frame has been composited, and
  //    in practice they are zero. This function used to read from a `setInterval`, i.e. always
  //    after compositing, so on a game drawing perfectly it returned false FOREVER. Measured on
  //    this build at 1440x900, same game, same second:
  //        from a timer                       lit    0 / 2880
  //        inside requestAnimationFrame       lit 2753 / 2880   (95.6%)
  //        three frames later, still in rAF   lit 2755 / 2880   (stable, not luck)
  //    The grid fix below was correct and did not matter: every cell of it read black.
  //
  // 2. HOW OFTEN. The old body fired 2,280 single-pixel `readPixels` calls at 1440x900, each one
  //    a GPU sync, and the poll called it every 200 ms. Measured cost of ONE call on this box
  //    (load 16.5 over 4 cores, so read it as an upper bound rather than as a phone figure):
  //    8,781 ms. The page's main thread was saturated by its own diagnostic — enough that
  //    `page.screenshot()` timed out and the instrument that grades playability could not take a
  //    picture of the game. Fewer pixels is NOT the saving: 16 full-width band reads cost 8,019 ms
  //    on the same frame. The sync is the cost, so the fix is to read RARELY and to stop as soon
  //    as the answer is yes.
  //
  // So: at most one read in flight, at most one every READ_EVERY_MS, always inside a frame, and
  // the poll below reads the cached answer instead of taking one itself.
  var READ_EVERY_MS = 2000;
  var paintSeen = 0, paintLit = 0, paintAt = 0, paintPending = false;
  window.__BOOT_PAINT_EVIDENCE = null;   // so an instrument can see WHICH signal decided it
  function schedulePaintRead() {
    if (paintPending || done) return;
    if (paintAt && Date.now() - paintAt < READ_EVERY_MS) return;
    paintPending = true;
    requestAnimationFrame(function () {
      paintPending = false;
      paintAt = Date.now();
      try {
        var c = document.querySelector('canvas');
        if (!c || !c.width) return;
        // Do not create the context. If the renderer has not made one yet there is nothing to
        // read and taking one here would hand the renderer OURS — the latch that cost this
        // project a false black-screen report in its own instrument.
        if (!(window.__ENGINE && window.__ENGINE.renderer)) return;
        var gl = c.getContext('webgl2') || c.getContext('webgl');
        if (!gl) return;
        // A GRID ACROSS THE WHOLE FRAME, not the bottom-left corner: the first version read
        // `readPixels(0, 0, 64, 64)`, 1.2% of the picture, which is floor in most scenes — a
        // drawn dungeon measured 33.35% lit overall and 0.02% in that corner, so the notice
        // never hid and sat undismissable over a working game. Bands, because 16 reads and
        // 2,280 reads cost the same and 16 is less to go wrong.
        var BANDS = 16, W = c.width, buf = new Uint8Array(W * 4), lit = 0, seen = 0;
        for (var i = 0; i < BANDS; i++) {
          var y = Math.floor((i + 0.5) * c.height / BANDS);
          gl.readPixels(0, y, W, 1, gl.RGBA, gl.UNSIGNED_BYTE, buf);
          for (var x = 0; x < W; x += 8) {
            var o = x * 4; seen++;
            if (buf[o] > 8 || buf[o + 1] > 8 || buf[o + 2] > 8) lit++;
          }
        }
        paintSeen = seen; paintLit = lit;
      } catch (e) { /* leave the previous reading; drawing() below is the guard */ }
    });
  }

  // Is the renderer running at all? This is not a substitute for looking at the pixels — a
  // context that accepts every call and rasterises none would still advance these — but it is
  // the difference between "I can see it is black" and "I could not see". The notice must never
  // accuse on the second.
  var lastRenderFrame = -1;
  function drawing() {
    try {
      var info = window.__ENGINE.renderer.three.info.render;
      var advanced = info.frame > lastRenderFrame;
      lastRenderFrame = info.frame;
      return advanced && info.calls > 0;
    } catch (e) { return false; }
  }

  function painted() {
    schedulePaintRead();
    if (paintSeen > 0 && paintLit > paintSeen * 0.01) {
      window.__BOOT_PAINT_EVIDENCE = 'pixels ' + paintLit + '/' + paintSeen;
      return true;
    }
    // No usable reading yet. If the renderer is demonstrably drawing frames, we have NOT shown
    // the screen is black — we have failed to look — and saying "nothing is being drawn" would
    // be a red full-screen accusation over a working game. That has now happened twice, by two
    // different mechanisms, and both times it was shipped as the fix for a black screen.
    if (drawing()) {
      window.__BOOT_PAINT_EVIDENCE = 'frames advancing; buffer not readable' +
        (paintAt ? ' (last read ' + paintLit + '/' + paintSeen + ')' : ' (no read yet)');
      return true;
    }
    window.__BOOT_PAINT_EVIDENCE = paintAt ? 'read black ' + paintLit + '/' + paintSeen + ' and no frames'
                                           : 'no read and no frames';
    return false;
  }

  // Everything a phone can tell us about why it will not draw. Deliberately terse: it has to be
  // readable in a screenshot on a small screen.
  function deviceLine() {
    var bits = [];
    // Build it a fact at a time and never let one bad probe cost the rest of the line. The old
    // version wrapped the whole thing in one try, and `gl instanceof WebGL2RenderingContext`
    // throws a ReferenceError on a browser with no WebGL2 constructor — an OLD PHONE, which is
    // the exact device this line is written for. It would have printed the canvas size and then
    // nothing at all, on the only hardware where the rest of it matters.
    function add(label, fn) { try { var v = fn(); if (v !== null && v !== undefined && v !== '') bits.push(label ? label + ' ' + v : String(v)); } catch (e) { bits.push((label || 'probe') + ' ?'); } }
    var c = document.querySelector('canvas');
    add('', function () { return 'canvas ' + (c ? c.width + 'x' + c.height + ' css ' + c.clientWidth + 'x' + c.clientHeight : 'none'); });
    add('vp', function () { return window.innerWidth + 'x' + window.innerHeight + '@' + (window.devicePixelRatio || 1); });
    // What the DEVICE has, which is the usual reason a phone refuses a 17 MB world: it runs out
    // of memory building it and the tab is killed or the context is lost. Neither number is on
    // any desktop failure and both are on most phone ones.
    add('mem', function () { return navigator.deviceMemory ? navigator.deviceMemory + 'GB' : null; });
    add('cores', function () { return navigator.hardwareConcurrency || null; });
    // THE PROBE MUST NOT TAKE THE GAME'S CONTEXT. A canvas has exactly one context, and this
    // line is now printed on failures that happen BEFORE the renderer has made its own — a 404
    // at one second, say. Calling `getContext` on the real canvas then would hand the renderer
    // our context, created with the default `preserveDrawingBuffer: false`, and every readPixels
    // after it — including `painted()` above — would return zeros on a game that draws perfectly.
    // The instrument that grades this page had the identical latch and its critic caught it.
    //
    // So: every LIMIT is asked of a throwaway canvas, because limits are properties of the
    // device and not of the canvas. Only the two facts that are genuinely about the game's own
    // context — what attributes it got, and whether it has been lost — read the real one, and
    // only once the renderer has demonstrably made it.
    var gl = null, real = null;
    try {
      var probe = document.createElement('canvas');
      gl = probe.getContext('webgl2') || probe.getContext('webgl');
    } catch (e) { /* reported as NO GL CONTEXT below */ }
    try { if (c && window.__ENGINE && window.__ENGINE.renderer) real = c.getContext('webgl2') || c.getContext('webgl'); } catch (e) { /* optional */ }
    if (!gl) { bits.push('NO GL CONTEXT'); }
    else {
      add('', function () { return (typeof WebGL2RenderingContext !== 'undefined' && gl instanceof WebGL2RenderingContext) ? 'webgl2' : 'webgl1'; });
      add('maxTex', function () { return gl.getParameter(gl.MAX_TEXTURE_SIZE); });
      add('maxRB', function () { return gl.getParameter(gl.MAX_RENDERBUFFER_SIZE); });
      // Two limits that silently break a shader rather than throwing, so they never reach the
      // error handler and would otherwise be invisible in a report.
      add('varyings', function () { return gl.getParameter(gl.MAX_VARYING_VECTORS); });
      add('vtex', function () { return gl.getParameter(gl.MAX_VERTEX_TEXTURE_IMAGE_UNITS); });
      // A float-renderable colour buffer is the classic thing an older iOS device will not give
      // you, and a renderer that wants one gets an incomplete framebuffer and draws black.
      add('float-rt', function () { return (gl.getExtension('EXT_color_buffer_float') || gl.getExtension('WEBGL_color_buffer_float')) ? 'yes' : 'NO'; });
      // What the renderer actually got, which is not always what it asked for: a browser under
      // memory pressure hands back a context with antialias or depth quietly dropped.
      add('', function () { var d = gl.getExtension('WEBGL_debug_renderer_info'); return d ? String(gl.getParameter(d.UNMASKED_VENDOR_WEBGL)).slice(0, 24) + '/' + String(gl.getParameter(d.UNMASKED_RENDERER_WEBGL)).slice(0, 56) : null; });
    }
    if (!real) { bits.push('game-ctx not-yet'); }
    else {
      add('attrs', function () { var a = real.getContextAttributes(); return a ? ('aa=' + (a.antialias ? 1 : 0) + ' depth=' + (a.depth ? 1 : 0) + ' pdb=' + (a.preserveDrawingBuffer ? 1 : 0) + (a.failIfMajorPerformanceCaveat ? ' caveat-strict' : '')) : null; });
      add('glErr', function () { var e = real.getError(); return e ? '0x' + e.toString(16) : null; });
      add('', function () { return (real.isContextLost && real.isContextLost()) ? 'CONTEXT LOST' : null; });
    }
    // P10. How the NETWORK behaved, which no other fact in this line captures and which is the
    // whole diagnosis when the host is wobbling rather than the device. `__ES_LOAD_RETRIES` is
    // written by the data loader in engine.js on every attempt.
    add('load', function () {
      var L = window.__ES_LOAD_RETRIES;
      if (!L || !L.attempts) return null;
      return L.attempts + ' requests, ' + L.retries + ' retries, ' + Math.round(L.sleptMs) + 'ms waiting' +
             (L.stopped ? ', gave up at ' + L.stopped : '') +
             (L.failure ? ', last ' + L.failure.status + ' on ' + L.failure.file : '');
    });
    // Which build they are looking at. Without it a report is about "the game", and the game
    // changes several times an hour.
    add('build', function () { return (window.__ES_COMMIT || '?') + ' ' + location.pathname; });
    add('ua', function () { return navigator.userAgent.slice(0, 90); });
    return bits.join(' · ');
  }

  // A lost WebGL context is a phone's usual way of refusing, and it fires an event rather than
  // throwing, so nothing else here would ever see it.
  var cv = document.querySelector('canvas');
  if (cv) cv.addEventListener('webglcontextlost', function (ev) {
    ev.preventDefault();
    say('The browser took the 3D context away.',
        'This usually means the page asked for more graphics memory than the device would give it.', true);
  });

  var booted = false;
  var waitReady = setInterval(function () {
    var h = window.__HARNESS;
    if (!h || typeof h.ready !== 'function') return;
    clearInterval(waitReady);
    try {
      h.ready().then(function () { booted = true; }, function (err) {
        say('The world failed to build.', (err && (err.message || String(err))) || 'no reason given', true);
      });
    } catch (e) { say('The world failed to build.', String(e && e.message || e), true); }
  }, 150);

  // BOTH TIMERS BELOW ARE WALL-CLOCK NOW, and that is a correctness fix rather than a tidy-up.
  // `sinceBoot` used to be `+= 0.2` once per 200 ms tick — which is only seconds if the ticks
  // arrive on time. They did not: `painted()` was costing 8.8 s a call, so each "0.2 seconds"
  // was several real ones and the twenty-second escape hatch was well over a minute of a person
  // staring at a red error over a game that was running. A clock that runs slow exactly when the
  // page is in trouble is the wrong clock for a rescue timer.
  var bootAt = 0;
  var poll = setInterval(function () {
    if (done) { clearInterval(poll); return; }
    if (!booted) return;
    if (!bootAt) bootAt = Date.now();
    if (painted()) { clearInterval(poll); clearInterval(tick); hide(); return; }
    // Booted but nothing on the screen. Give the first frame a moment, then say what is true.
    var sinceBoot = (Date.now() - bootAt) / 1000;
    // Hard ceiling. Whatever the pixel read says, an overlay that cannot be dismissed is worse
    // than a wrong diagnosis: if the world booted and twenty seconds have passed, get out of the
    // player's way and let them look at whatever is there.
    if (sinceBoot > 20) { clearInterval(poll); clearInterval(tick); hide(); return; }
    if (sinceBoot > 6) {
      // Print what the device says about itself. A phone-only failure cannot be reproduced on the
      // build machine — desktop Chromium at a phone-sized viewport is not a phone — so the only
      // way anyone learns why is if the phone says so on its own screen.
      say('The world loaded, but nothing is being drawn.',
          'The game built itself and the screen stayed black, so this is the renderer rather than a ' +
          'missing file.', true);
    }
  }, 200);
})();
</script>
