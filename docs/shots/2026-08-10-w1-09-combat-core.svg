<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">W1-09 combo B reactability control</title>
  <desc id="desc">The shipped 23-frame startup reaches the 19-frame reaction floor; deleting the fix restores 18 frames and fails.</desc>
  <rect width="960" height="540" fill="#10151c"/>
  <text x="64" y="72" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="30" font-weight="700">W1-09 · combo_b reactability</text>
  <text x="64" y="108" fill="#aebdca" font-family="system-ui, sans-serif" font-size="17">RI-CMB12 M1 · same instrument, one-frame production delta</text>
  <line x1="250" y1="178" x2="250" y2="430" stroke="#536273" stroke-width="2"/>
  <line x1="250" y1="430" x2="860" y2="430" stroke="#536273" stroke-width="2"/>
  <line x1="830" y1="158" x2="830" y2="445" stroke="#f5c451" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="830" y="145" fill="#f5c451" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">native floor · 19 f</text>
  <text x="64" y="255" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="20">Fixed · startup 23</text>
  <rect x="250" y="215" width="580" height="58" rx="8" fill="#35b779"/>
  <text x="812" y="252" fill="#071810" text-anchor="end" font-family="system-ui, sans-serif" font-size="24" font-weight="700">19 f · GREEN</text>
  <text x="64" y="365" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="20">Delete-fix · startup 22</text>
  <rect x="250" y="325" width="550" height="58" rx="8" fill="#e45b5b"/>
  <text x="782" y="362" fill="#240606" text-anchor="end" font-family="system-ui, sans-serif" font-size="24" font-weight="700">18 f · RED</text>
  <text x="64" y="492" fill="#aebdca" font-family="system-ui, sans-serif" font-size="16">Observed in both idle and walk entry arms. Active, recovery and clip geometry unchanged.</text>
</svg>
