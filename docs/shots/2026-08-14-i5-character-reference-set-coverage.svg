  <text x="28" y="42" fill="#e8e4d4" font-size="21">The character reference set — what a builder can now open</text>
  <text x="28" y="66" fill="#8f9a92" font-size="13">252 files across 13 slots · 210 of them motion · 227 were already on disk · 25 newly acquired · 1 slot honestly empty</text>

