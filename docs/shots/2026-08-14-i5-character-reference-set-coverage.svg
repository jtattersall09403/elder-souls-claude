<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" font-family="Georgia, 'Times New Roman', serif">
  <title>The character reference set: 13 slots, 252 files, 210 of them motion</title>
  <desc>Coverage of the character reference set built for I5. Each bar is one slot; the number is how many reference files are routed to it. C5, a full-body turnaround of a modern humanoid, is empty and is drawn as such.</desc>
