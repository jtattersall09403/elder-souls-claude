<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">The remaining ambiguity in the HUD instrument plan</title>
  <desc id="desc">Six error rows are shown between conflicting pass and never-pass labels.</desc>
  <rect width="1200" height="630" fill="#17140f"/>
  <text x="80" y="105" fill="#e8d7ad" font-family="serif" font-size="42">ONE RESULT, TWO VERDICTS</text>
  <text x="80" y="155" fill="#a99b7b" font-family="sans-serif" font-size="22">W1-HUD-TOAST · plan re-critique</text>
  <rect x="80" y="215" width="470" height="245" rx="16" fill="#263a2d" stroke="#80a66b" stroke-width="3"/>
  <text x="315" y="270" text-anchor="middle" fill="#dcebcf" font-family="sans-serif" font-size="30">AGGREGATE SAYS PASS</text>
  <text x="315" y="330" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="25">14 / 14 classified</text>
  <text x="315" y="375" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="25">6 missing E_tool</text>
  <text x="315" y="420" text-anchor="middle" fill="#b9d3ad" font-family="sans-serif" font-size="21">fewer than 7</text>
  <rect x="650" y="215" width="470" height="245" rx="16" fill="#452625" stroke="#c46d62" stroke-width="3"/>
  <text x="885" y="270" text-anchor="middle" fill="#f2d2ce" font-family="sans-serif" font-size="30">ROWS SAY NEVER PASS</text>
  <text x="885" y="330" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="25">ERROR × 6</text>
  <text x="885" y="375" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="25">missing E_tool</text>
  <text x="885" y="420" text-anchor="middle" fill="#e6aaa3" font-family="sans-serif" font-size="21">never pass</text>
  <path d="M550 337 H650" stroke="#d1b86f" stroke-width="8" stroke-dasharray="14 10"/>
  <text x="600" y="535" text-anchor="middle" fill="#e8d7ad" font-family="serif" font-size="30">Resolve the predicate before dispatch.</text>
</svg>
