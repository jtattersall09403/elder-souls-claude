<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Every instrument outcome now has a deterministic result</title>
  <desc id="desc">A flow diagram showing six exhaustive classifications and that only fourteen independent results pass.</desc>
  <rect width="1200" height="675" fill="#17130f"/>
  <text x="70" y="92" fill="#ead8b3" font-family="Georgia,serif" font-size="42">The yardstick sweep now has no missing case</text>
  <text x="70" y="137" fill="#bfae8c" font-family="sans-serif" font-size="22">Every readable observation reaches one named outcome.</text>
  <g font-family="sans-serif" font-size="20" text-anchor="middle">
    <rect x="70" y="205" width="160" height="82" rx="8" fill="#6b3030"/><text x="150" y="254" fill="#fff">COUPLED</text>
    <rect x="250" y="205" width="160" height="82" rx="8" fill="#6b3030"/><text x="330" y="254" fill="#fff">INERT</text>
    <rect x="430" y="205" width="160" height="82" rx="8" fill="#2f6b4a"/><text x="510" y="254" fill="#fff">INDEPENDENT</text>
    <rect x="610" y="205" width="190" height="82" rx="8" fill="#6b3030"/><text x="705" y="254" fill="#fff">NON_DECISIVE</text>
    <rect x="820" y="205" width="210" height="82" rx="8" fill="#6b3030"/><text x="925" y="254" fill="#fff">WRONG_DIRECTION</text>
    <rect x="1050" y="205" width="100" height="82" rx="8" fill="#7a5b24"/><text x="1100" y="254" fill="#fff">ERROR</text>
  </g>
  <path d="M510 305v70" stroke="#d6bd86" stroke-width="5"/>
  <rect x="260" y="385" width="500" height="120" rx="12" fill="#252018" stroke="#d6bd86" stroke-width="3"/>
  <text x="510" y="433" fill="#ead8b3" font-family="Georgia,serif" font-size="30" text-anchor="middle">PASS only at 14 / 14 INDEPENDENT</text>
  <text x="510" y="474" fill="#bfae8c" font-family="sans-serif" font-size="19" text-anchor="middle">Every other named result is honest, actionable, and non-passing.</text>
  <text x="70" y="605" fill="#9f9178" font-family="sans-serif" font-size="18">W1-HUD-TOAST · plan remediation · 2026-08-09</text>
</svg>
