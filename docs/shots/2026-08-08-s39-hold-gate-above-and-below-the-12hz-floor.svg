<text x="373" y="518" fill="#8fae74" font-size="12" text-anchor="middle">sprint</text>
<text x="373" y="535" fill="#6d6154" font-size="11" text-anchor="middle">sim 15f</text>
<rect x="432" y="230" width="54" height="250" fill="#6f8f5a" stroke="#e8dcc6" stroke-width="1"/>
