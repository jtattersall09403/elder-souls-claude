<text x="1019" y="518" fill="#8fae74" font-size="12" text-anchor="middle">sprint</text>
<text x="1019" y="535" fill="#6d6154" font-size="11" text-anchor="middle">sim 5f</text>
<text x="40" y="562" fill="#9d8f76" font-size="14">"sim Nf" under each bar is how many fixed frames elapsed while the finger was down. Below the floor it is 0-5 for every press — the number the gate used to count.</text>
<text x="40" y="586" fill="#e8dcc6" font-size="15">Promoted action correct: 5/5 above the floor, 5/5 below it. Before S39 the referral measured 5 of 5 wrongly rolled.</text>
<text x="40" y="608" fill="#9d8f76" font-size="14">Replay hash above vs below the floor: BIT-IDENTICAL (4df0b92a5a7b7c8d).</text>
