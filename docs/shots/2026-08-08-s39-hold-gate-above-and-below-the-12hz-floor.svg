<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" font-family="Iowan Old Style, Palatino, Georgia, serif">
<rect width="1180" height="620" fill="#14100c"/>
<text x="40" y="52" fill="#e8dcc6" font-size="26">The hold gate, above and below the 12.00 Hz floor</text>
<text x="40" y="80" fill="#9d8f76" font-size="15">ARBITRATION S39's own falsifier, run at 692bcc8. Bars are the frames the GAME counted for each press; the dashed line is the 12 f@60 gate.</text>
<text x="40" y="102" fill="#9d8f76" font-size="15">Below the floor the world runs at 18.5% of real time. The thumb does not slow down with it — that asymmetry is the whole seam.</text>
<text x="70" y="150" fill="#e8dcc6" font-size="17">above the floor — rAF 48.33 Hz, 61 fixed steps/s</text>
<line x1="70" y1="380" x2="530" y2="380" stroke="#c9a227" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="536" y="385" fill="#c9a227" font-size="13">12 f@60</text>
