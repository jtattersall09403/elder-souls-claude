<text x="115" y="500" fill="#9d8f76" font-size="12" text-anchor="middle">20 ms</text>
<text x="115" y="518" fill="#8fae74" font-size="12" text-anchor="middle">roll</text>
<text x="115" y="535" fill="#6d6154" font-size="11" text-anchor="middle">sim 1f</text>
